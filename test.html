<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification System Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
      background-color: #f9f9f9;
    }
    .card {
      max-width: 400px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
    }
    .btn-new { background-color: #28a745; }
    .btn-reminder { background-color: #007bff; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Shanti Jewel Notification Test</h2>
    <p>Tap below to trigger sample notifications on your device.</p>

    <!-- TEST 1: NEW ORDER -->
    <button class="btn-new" onclick="triggerNewOrderTest()">
      Test New Order Notification
    </button>

    <!-- TEST 2: DELIVERY REMINDER -->
    <button class="btn-reminder" onclick="triggerDeliveryReminderTest()">
      Test Delivery Reminder Notification
    </button>
  </div>

  <script>
    // Register sw.js from the same folder
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // Reliable sample photo for testing
    const samplePhotoUrl = 'https://picsum.photos/600/400';

    async function sendNotification(title, body, imageUrl) {
      if (!('Notification' in window)) {
        alert('Notifications are not supported on this browser.');
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('Permission denied. Please allow notifications in site settings.');
        return;
      }

      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(title, {
        body: body,
        icon: 'https://cdn-icons-png.flaticon.com/512/3081/3081559.png',
        image: imageUrl,
        badge: 'https://cdn-icons-png.flaticon.com/512/3081/3081559.png'
      });
    }

    // 1. Test Instant New Order Notification
    function triggerNewOrderTest() {
      sendNotification(
        'Order #97502555',
        'Rajesh Gold placed order',
        samplePhotoUrl
      );
    }

    // 2. Test Scheduled Delivery Reminder Notification
    function triggerDeliveryReminderTest() {
      sendNotification(
        'Delivery Reminder (In 2 Days) - #97502555',
        'Rajesh Gold order delivery scheduled',
        samplePhotoUrl
      );
    }
  </script>

</body>
</html>
