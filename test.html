<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Diagnostic Test</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding: 40px 20px;">

  <h2>Shanti Jewel - Notification Test</h2>
  <button id="btn" style="padding: 16px 28px; background-color: #d4af37; color: #ffffff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold;">
    🔔 Click to Test Notification
  </button>

  <script>
    document.getElementById('btn').onclick = async () => {
      // 1. HTTPS Check
      if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        alert('❌ ERROR: Notifications ONLY work on HTTPS links (https://). Your site is currently using HTTP or opening as a local file.');
        return;
      }

      // 2. Browser Support Check
      if (!('Notification' in window)) {
        alert('❌ ERROR: This browser does not support notifications.');
        return;
      }

      // 3. Permission Request
      alert('1. Requesting notification permission...');
      const permission = await Notification.requestPermission();
      
      if (permission !== 'granted') {
        alert('❌ PERMISSION BLOCKED: Permission is "' + permission + '". Go to your phone browser settings -> Site Settings -> Notifications -> Allow.');
        return;
      }

      alert('2. Permission GRANTED! Registering sw.js...');

      // 4. Service Worker Registration & Notification
      try {
        const reg = await navigator.serviceWorker.register('./sw.js');
        
        await reg.showNotification('Trial Order #101 - Shanti Jewel', {
          body: 'New order received for 3g Gold Earrings',
          icon: 'https://via.placeholder.com/192.png?text=Logo',
          image: 'https://via.placeholder.com/600x400.png?text=Jewelry+Photo+Preview'
        });

        alert('✅ SUCCESS! Notification sent. Check your phone top bar/tray.');
      } catch (err) {
        alert('❌ SERVICE WORKER ERROR: ' + err.message + '\n\nCheck if sw.js is in the exact same folder.');
      }
    };
  </script>

</body>
</html>
