<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHANTI JEWEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --gold: #D4AF37; --brown: #3E2723; --cream: #FFFDE7; --text: #212121; --red: #c62828; }
        body { font-family: 'Montserrat', sans-serif; background: #fdfbf7; margin: 0; padding-bottom: 90px; color: var(--text); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        /* Locks */
        #mainLock { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--brown); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .lock-container { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 25px; border: 1px solid var(--gold); width: 85%; max-width: 320px; text-align: center; }

        .header { background: var(--brown); color: var(--gold); text-align: center; padding: 25px 10px; border-bottom: 5px solid var(--gold); }
        .header h1 { font-family: 'Cinzel', serif; margin: 0; font-size: 24px; letter-spacing: 4px; }

        /* Multi-Photo Grid */
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .photo-box { height: 100px; background: #fdfbf7; border: 2px dashed var(--gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--gold); font-size: 10px; font-weight: 800; text-align: center; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Expanded Details */
        .full-details { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #eee; display: none; }
        .card.expanded .full-details { display: block; }
        .detail-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .detail-row b { color: var(--brown); }
        .img-strip { display: flex; gap: 5px; overflow-x: auto; margin-top: 10px; padding-bottom: 5px; }
        .img-strip img { height: 80px; width: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gold); }

        /* Order Form Popup (Workshop) */
        #jobCardOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; overflow-y:auto; padding:15px; }
        .digital-form { background: #fff; border: 6px double var(--gold); padding: 20px; max-width: 400px; margin: 20px auto; }
        .df-header { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 12px; margin-bottom: 15px; }
        .df-img-main { width: 100%; height: 250px; object-fit: contain; background: #fcfcfc; margin-bottom: 10px; }

        /* Tabs & Buttons */
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; height: 75px; border-top: 2px solid var(--gold); z-index: 1000; }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; color: #bbb; text-transform: uppercase; }
        .tab.active { color: var(--brown); background: var(--cream); border-top: 5px solid var(--gold); }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .btn-gold { background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728); border: none; padding: 15px; border-radius: 12px; color: #3E2723; font-weight: 800; width: 100%; text-transform: uppercase; margin-top: 10px; }
        .btn-red { background: var(--red); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: 800; }
        .card { background: white; border-radius: 18px; padding: 15px; margin-bottom: 15px; border: 1px solid #f0f0f0; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }

        /* Dashboard Table */
        .party-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .party-table th { background: var(--brown); color: var(--gold); padding: 8px; text-align: left; }
        .party-table td { padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div id="mainLock">
    <h1 style="font-family:'Cinzel'; color:var(--gold); letter-spacing:5px; margin-bottom: 20px;">SHANTI JEWEL</h1>
    <div class="lock-container">
        <input type="password" id="entryPin" placeholder="PIN" style="text-align:center; letter-spacing:15px; font-size:24px; width:100%; margin-bottom:15px; border-radius:12px; border:none; padding:10px;">
        <button class="btn-gold" onclick="unlockMain()">ENTER APP</button>
    </div>
</div>

<div id="jobCardOverlay" onclick="this.style.display='none'">
    <div class="digital-form" onclick="event.stopPropagation()">
        <div class="df-header">
            <small>॥ श्री ॥</small>
            <h2 style="font-family:'Cinzel'; margin:5px 0;">SHANTI JEWEL</h2>
            <small style="color:var(--gold); letter-spacing:2px;">ORDER FORM</small>
        </div>
        <img id="jc_img" class="df-img-main" src="">
        <div id="jc_strip" class="img-strip"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
            <div><small>WT</small><br><b id="jc_wt"></b></div>
            <div><small>KT</small><br><b id="jc_kt"></b></div>
            <div><small>SZ</small><br><b id="jc_sz"></b></div>
        </div>
        <p id="jc_sp" style="font-size:12px; margin-top:15px; background:#f9f9f9; padding:10px;"></p>
        <button class="btn-red" onclick="document.getElementById('jobCardOverlay').style.display='none'">CLOSE</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <div class="header"><h1>SHANTI JEWEL</h1></div>

    <div id="punchPage" class="page active">
        <div class="photo-grid">
            <div class="photo-box" onclick="triggerImg(0)" id="pb0">IMG 1</div>
            <div class="photo-box" onclick="triggerImg(1)" id="pb1">IMG 2</div>
            <div class="photo-box" onclick="triggerImg(2)" id="pb2">IMG 3</div>
            <div class="photo-box" onclick="triggerImg(3)" id="pb3">IMG 4</div>
        </div>
        <input type="file" id="fileInput" hidden onchange="processMultiPhoto(this)">
        
        <input type="text" id="i_id" placeholder="ORDER ID">
        <select id="i_pa">
            <option value="">SELECT PARTY</option>
            <option>REVA DIAMONDS</option>
            <option>Shree Gajanan Jewellers</option>
            <option>P.N.GADGIL & SONS</option>
            <option>PNG Brothers</option>
            <option>Neelkanth Jewellers</option>
            <option>Inhouse Production</option>
        </select>
        <select id="i_cad"><option value="">DESIGNER</option><option>DYE</option><option>SHINDE</option><option>ALAUDDIN</option></select>
        <div style="display:flex; gap:10px;"><input type="number" step="0.001" id="i_wt" placeholder="WT"><input type="text" id="i_kt" placeholder="KT"></div>
        <div style="display:flex; gap:10px;"><input type="text" id="i_sz" placeholder="Size"><input type="date" id="i_dd"></div>
        <textarea id="i_sp" rows="2" placeholder="Special Instructions..."></textarea>
        <button class="btn-gold" onclick="saveOrder()">PUNCH ORDER</button>
    </div>

    <div id="activePage" class="page">
        <input type="text" id="src" placeholder="Search ID..." onkeyup="loadData()">
        <div id="activeList"></div>
    </div>

    <div id="historyPage" class="page">
        <div id="historyList"></div>
    </div>

    <div id="dashPage" class="page">
        <div id="dashLock" style="text-align:center; padding:40px 10px; background:var(--brown); border-radius:20px; color:white;">
            <h3 style="font-family:'Cinzel';">ADMIN DASH</h3>
            <input type="password" id="dashPinInput" placeholder="PIN" style="text-align:center; letter-spacing:10px; width:150px; padding:10px; margin-bottom:10px;">
            <button class="btn-gold" onclick="unlockDash()">UNLOCK</button>
        </div>
        <div id="dashBody" style="display:none;">
            <div id="stats" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;"></div>
            <div id="partyAnalysis"></div>
            <button class="btn-red" style="margin-top:20px;" onclick="wipeData()">WIPEOUT DATABASE</button>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="nav('punch', this)">Punch</div>
        <div class="tab" onclick="nav('active', this)">Active</div>
        <div class="tab" onclick="nav('history', this)">History</div>
        <div class="tab" onclick="nav('dash', this)">Dash</div>
    </div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyBnvmQBPkJmJcjXf71vEUY91B2_2P9oAgU", databaseURL: "https://shanti-jewel-order-default-rtdb.firebaseio.com/", projectId: "shanti-jewel-order" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const stages = ["CAD", "CAM", "CASTING", "POLISH", "HUID", "READY"];
let photos = [null, null, null, null];
let activeSlot = 0;

function unlockMain() {
    if(document.getElementById('entryPin').value === '1008') {
        document.getElementById('mainLock').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        loadData();
    } else { alert("WRONG PIN"); }
}

function unlockDash() {
    if(document.getElementById('dashPinInput').value === '2215') {
        document.getElementById('dashLock').style.display = 'none';
        document.getElementById('dashBody').style.display = 'block';
    } else { alert("WRONG PIN"); }
}

function triggerImg(slot) { activeSlot = slot; document.getElementById('fileInput').click(); }

function processMultiPhoto(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const cvs = document.createElement('canvas');
            const max = 500; let w=img.width, h=img.height;
            if(w>max){ h *= max/w; w=max; }
            cvs.width=w; cvs.height=h;
            cvs.getContext('2d').drawImage(img,0,0,w,h);
            photos[activeSlot] = cvs.toDataURL('image/jpeg', 0.6);
            document.getElementById('pb'+activeSlot).innerHTML = `<img src="${photos[activeSlot]}">`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
}

async function saveOrder() {
    const id = document.getElementById('i_id').value;
    if(!id || !photos[0]) return alert("ID and at least 1 Photo required");
    const obj = {
        id, party: document.getElementById('i_pa').value, cad: document.getElementById('i_cad').value,
        wt: parseFloat(document.getElementById('i_wt').value) || 0, kt: document.getElementById('i_kt').value,
        sz: document.getElementById('i_sz').value, dd: document.getElementById('i_dd').value,
        sp: document.getElementById('i_sp').value, photos: photos.filter(p => p !== null), status: "CAD", ts: Date.now()
    };
    await db.ref('orders/' + id).set(obj);
    location.reload();
}

function openOrderForm(o) {
    document.getElementById('jc_img').src = o.photos[0];
    document.getElementById('jc_wt').innerText = o.wt + "g";
    document.getElementById('jc_kt').innerText = o.kt;
    document.getElementById('jc_sz').innerText = o.sz;
    document.getElementById('jc_sp').innerText = o.sp || "No instructions";
    const strip = document.getElementById('jc_strip');
    strip.innerHTML = o.photos.map(p => `<img src="${p}">`).join('');
    document.getElementById('jobCardOverlay').style.display = 'block';
}

function loadData() {
    const search = document.getElementById('src').value.toLowerCase();
    db.ref('orders').on('value', snap => {
        const act = document.getElementById('activeList');
        const hist = document.getElementById('historyList');
        const statsDiv = document.getElementById('stats');
        act.innerHTML = ""; hist.innerHTML = "";
        const data = snap.val() ? Object.values(snap.val()).reverse() : [];
        const counts = {}; stages.forEach(s => counts[s] = 0);
        const partyDist = {};

        data.forEach(o => {
            counts[o.status]++;
            if(!partyDist[o.party]) partyDist[o.party] = { pcs: 0, wt: 0 };
            partyDist[o.party].pcs++; partyDist[o.party].wt += o.wt;

            const card = `<div class="card" onclick="this.classList.toggle('expanded')">
                <div style="display:flex; justify-content:space-between;">
                    <div style="display:flex; gap:10px;">
                        <img src="${o.photos[0]}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                        <div><b style="color:var(--brown);">${o.id}</b><br><small>${o.party}</small></div>
                    </div>
                    <div style="text-align:right;"><small>Status</small><br><b style="color:var(--gold); font-size:10px;">${o.status}</b></div>
                </div>
                <div class="full-details">
                    <div class="img-strip">${o.photos.map(p => `<img src="${p}">`).join('')}</div>
                    <div class="detail-row"><span>Party:</span><b>${o.party}</b></div>
                    <div class="detail-row"><span>Designer:</span><b>${o.cad}</b></div>
                    <div class="detail-row"><span>Weight:</span><b>${o.wt}g</b></div>
                    <div class="detail-row"><span>Purity:</span><b>${o.kt}</b></div>
                    <div class="detail-row"><span>Size:</span><b>${o.sz}</b></div>
                    <div class="detail-row"><span>Delivery:</span><b style="color:red;">${o.dd || 'TBD'}</b></div>
                    <div style="margin-top:10px;"><small>Instructions:</small><p style="margin:5px 0; font-size:12px;">${o.sp || 'None'}</p></div>
                    <button class="btn-gold" style="height:40px; font-size:11px;" onclick="event.stopPropagation(); openOrderForm(${JSON.stringify(o).replace(/"/g, '&quot;')})">VIEW ORDER FORM</button>
                    ${o.status!=='READY'?`<button class="btn-gold" style="background:var(--brown); color:var(--gold); height:40px;" onclick="event.stopPropagation(); move('${o.id}','${o.status}')">NEXT STAGE</button>`:''}
                </div></div>`;
            
            if(o.status !== 'READY') {
                if(!search || o.id.toLowerCase().includes(search)) act.innerHTML += card;
            } else { hist.innerHTML += card; }
        });

        statsDiv.innerHTML = stages.map(s => `<div style="background:var(--brown); color:var(--gold); padding:10px; border-radius:10px; text-align:center;"><h3>${counts[s]}</h3><small>${s}</small></div>`).join('');
        let tbl = `<table class="party-table"><thead><tr><th>Party</th><th>Pcs</th><th>Wt</th></tr></thead><tbody>`;
        for (const p in partyDist) tbl += `<tr><td>${p}</td><td>${partyDist[p].pcs}</td><td>${partyDist[p].wt.toFixed(3)}g</td></tr>`;
        document.getElementById('partyAnalysis').innerHTML = tbl + `</tbody></table>`;
    });
}

function move(id, cur) { const nxt = stages[stages.indexOf(cur)+1]; if(nxt) db.ref('orders/'+id).update({status: nxt}); }
function wipeData() { if(confirm("ERASE ALL DATA?")) db.ref('orders').remove(); }
function nav(p, el) { 
    document.querySelectorAll('.page, .tab').forEach(x => x.classList.remove('active')); 
    document.getElementById(p+'Page').classList.add('active'); 
    el.classList.add('active'); 
}
</script>
</body>
</html>
