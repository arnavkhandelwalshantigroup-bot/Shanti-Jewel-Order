<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHANTI JEWEL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --gold: #D4AF37; --brown: #3E2723; --cream: #FFFDE7; --text: #212121; }
        body { font-family: 'Montserrat', sans-serif; background: #fdfbf7; margin: 0; padding-bottom: 90px; color: var(--text); }
        
        .header { background: var(--brown); color: var(--gold); text-align: center; padding: 25px 10px; border-bottom: 5px solid var(--gold); }
        .header h1 { font-family: 'Cinzel', serif; margin: 0; font-size: 26px; letter-spacing: 5px; }
        .header span { font-size: 10px; letter-spacing: 8px; display: block; margin-bottom: 5px; }

        .premium-overlay { position: fixed; inset: 0; background: var(--brown); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 30px; border-radius: 20px; text-align: center; border: 3px solid var(--gold); width: 85%; max-width: 350px; }
        
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; height: 70px; border-top: 2px solid var(--gold); z-index: 1000; }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; }
        .tab.active { color: var(--brown); background: var(--cream); border-top: 5px solid var(--gold); }

        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; position: relative;}
        
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; box-sizing: border-box; }
        .btn-gold { background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728); border: none; padding: 14px; border-radius: 10px; color: #3E2723; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 12px;}

        /* Timeline on Main Page */
        .timeline { display: flex; justify-content: space-between; margin: 25px 0 10px 0; position: relative; padding: 0 5px; }
        .timeline::before { content: ""; position: absolute; top: 5px; left: 10px; right: 10px; height: 2px; background: #eee; z-index: 1; }
        .t-step { width: 10px; height: 10px; border-radius: 50%; background: #ddd; z-index: 2; position: relative; }
        .t-step.active { background: var(--gold); box-shadow: 0 0 5px var(--gold); }
        .t-label { position: absolute; top: 15px; font-size: 6.5px; transform: translateX(-40%); white-space: nowrap; font-weight: bold; color: #aaa; text-transform: uppercase;}
        .t-step.active .t-label { color: var(--brown); }

        .order-details { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ddd; font-size: 12px; }
        .order-details.open { display: block; }
    </style>
</head>
<body>

<div id="loginOverlay" class="premium-overlay">
    <div class="login-card">
        <span style="letter-spacing: 5px; color: var(--gold); font-weight: bold;">॥ श्री ॥</span>
        <h2 style="font-family: 'Cinzel'; color: var(--brown);">SHANTI JEWEL</h2>
        <input type="password" id="passInput" placeholder="PIN" style="text-align:center; letter-spacing: 10px;">
        <button class="btn-gold" onclick="auth()">ACCESS</button>
    </div>
</div>

<div class="header">
    <span>॥ श्री ॥</span>
    <h1>SHANTI JEWEL</h1>
</div>

<div id="punchPage" class="page active">
    <div class="card">
        <div id="p1" style="height:140px; background:#fdfdfd; border:2px dashed var(--gold); border-radius:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:10px;" onclick="document.getElementById('f1').click()">CLICK TO ADD PHOTO</div>
        <input type="file" id="f1" accept="image/*" hidden onchange="cmp(this, 0, 'p1')">
        <input type="text" id="i_id" placeholder="ORDER ID">
        <select id="i_pa">
            <option value="">SELECT PARTY</option>
            <option>Shree Gajanan Jewellers</option>
            <option>P.N.GADGIL & SONS</option>
            <option>PNG Brothers</option>
            <option>Neelkanth Jewellers</option>
            <option>Annapurna Gold</option>
            <option>Inhouse Production</option>
        </select>
        <div style="display:flex; gap:10px;"><input type="number" step="0.001" id="i_wt" placeholder="WT"><input type="text" id="i_kt" placeholder="KT"></div>
        <div style="display:flex; gap:10px;"><input type="text" id="i_sz" placeholder="SIZE"><input type="date" id="i_dd"></div>
        <textarea id="i_sp" rows="2" placeholder="SPECIFICATIONS"></textarea>
        <button class="btn-gold" id="saveBtn" onclick="save()">PUNCH ORDER</button>
    </div>
</div>

<div id="activePage" class="page">
    <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="src" placeholder="SEARCH ID..." onkeyup="load()" style="margin:0; flex:1.2;">
        <select id="partyFilter" onchange="load()" style="margin:0; flex:1;">
            <option value="">ALL PARTIES</option>
            <option>Shree Gajanan Jewellers</option>
            <option>P.N.GADGIL & SONS</option>
            <option>PNG Brothers</option>
            <option>Neelkanth Jewellers</option>
            <option>Annapurna Gold</option>
            <option>Inhouse Production</option>
        </select>
    </div>
    <div id="activeList"></div>
</div>

<div id="dashPage" class="page">
    <div id="dashLock" class="card" style="text-align:center; padding:50px 20px; background:var(--brown); color:white;">
        <h2 style="font-family:'Cinzel'; color:var(--gold);">DASHBOARD LOCK</h2>
        <input type="password" id="dpin" placeholder="PIN" style="text-align:center; letter-spacing:10px; max-width:200px;">
        <button class="btn-gold" onclick="unlockD()">UNLOCK</button>
    </div>
    <div id="dashBody" style="display:none;">
        <div id="stats" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab active" onclick="nav('punch', this)">Punch</div>
    <div class="tab" onclick="nav('active', this)">Active</div>
    <div class="tab" onclick="nav('dash', this)">Dash</div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBnvmQBPkJmJcjXf71vEUY91B2_2P9oAgU",
    authDomain: "shanti-jewel-order.firebaseapp.com",
    projectId: "shanti-jewel-order",
    databaseURL: "https://shanti-jewel-order-default-rtdb.firebaseio.com/",
    storageBucket: "shanti-jewel-order.appspot.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database(), storage = firebase.storage();
const stages = ["CAD", "CAM", "CASTING", "POLISH", "HUID", "READY"];
let blobs = [null];

function auth(){ if(document.getElementById('passInput').value==='1008'){ document.getElementById('loginOverlay').remove(); load(); } }
function unlockD(){ if(document.getElementById('dpin').value==='2215'){ document.getElementById('dashLock').style.display='none'; document.getElementById('dashBody').style.display='block'; } }

function cmp(input, idx, pId) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const cvs = document.createElement('canvas');
            const MAX = 800; let w=img.width, h=img.height;
            if(w>MAX){ h *= MAX/w; w=MAX; }
            cvs.width=w; cvs.height=h;
            cvs.getContext('2d').drawImage(img,0,0,w,h);
            cvs.toBlob(b => { blobs[idx]=b; document.getElementById(pId).innerHTML=`<img src="${URL.createObjectURL(b)}" style="width:100%; height:100%; object-fit:contain;">`; }, 'image/jpeg', 0.8);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

async function save() {
    const id = document.getElementById('i_id').value;
    if(!id) return alert("Enter Order ID");
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.innerText = "UPLOADING IMAGE...";

    const data = {
        id: id, party: document.getElementById('i_pa').value,
        wt: document.getElementById('i_wt').value, kt: document.getElementById('i_kt').value,
        sz: document.getElementById('i_sz').value, dd: document.getElementById('i_dd').value,
        sp: document.getElementById('i_sp').value, status: "CAD", ts: Date.now()
    };

    try {
        if(blobs[0]){
            const ref = storage.ref(`orders/${id}/p0.jpg`);
            await ref.put(blobs[0]);
            const url = await ref.getDownloadURL();
            data.imgs = [url]; // Attach image URL directly to the data object
        }
        
        await db.ref('orders/'+id).set(data);
        alert("PUNCHED SUCCESSFULLY!");
        location.reload();
    } catch(e) { 
        alert("System Error: " + e.message); 
        btn.disabled=false; 
        btn.innerText = "PUNCH ORDER";
    }
}

function load() {
    const search = document.getElementById('src').value.toLowerCase();
    const pFilter = document.getElementById('partyFilter').value;
    
    db.ref('orders').on('value', snap => {
        const all = Object.values(snap.val() || {});
        const act = document.getElementById('activeList');
        act.innerHTML = "";
        
        all.reverse().forEach(o => {
            if((!search || o.id.toLowerCase().includes(search)) && (!pFilter || o.party === pFilter)) {
                if(o.status !== 'READY') {
                    const img = (o.imgs && o.imgs[0]) ? o.imgs[0] : '';
                    act.innerHTML += `
                    <div class="card" onclick="this.querySelector('.order-details').classList.toggle('open')">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <div style="display:flex; gap:12px; align-items:center;">
                                <img src="${img}" style="width:60px; height:60px; border-radius:8px; border:1px solid var(--gold); object-fit:cover; background:#f4f4f4;">
                                <div><b style="font-size:16px; color:var(--brown);">${o.id}</b><br><small style="font-weight:600;">${o.party}</small></div>
                            </div>
                            <div style="text-align:right;"><small style="color:var(--gold); font-weight:bold;">DELIVERY:<br>${o.dd || 'TBD'}</small></div>
                        </div>

                        <div class="timeline">
                            ${stages.map((s,i) => `<div class="t-step ${stages.indexOf(o.status) >= i ? 'active' : ''}"><span class="t-label">${s}</span></div>`).join('')}
                        </div>
                        
                        <div class="order-details">
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px; background:#f9f9f9; padding:12px; border-radius:10px; margin-top:10px;">
                                <span><b>WT:</b> ${o.wt}g</span><span><b>PURITY:</b> ${o.kt}</span>
                                <span><b>SIZE:</b> ${o.sz}</span><span><b>STAGE:</b> ${o.status}</span>
                            </div>
                            <p style="margin:12px 0; font-size:12px;"><b>Notes:</b> ${o.sp || '-'}</p>
                            <button class="btn-gold" style="padding:10px; font-size:10px;" onclick="event.stopPropagation(); move('${o.id}', '${o.status}')">MOVE TO NEXT STAGE</button>
                        </div>
                    </div>`;
                }
            }
        });
    });
}

function move(id, cur) {
    const nextIdx = stages.indexOf(cur) + 1;
    if(nextIdx < stages.length) db.ref('orders/'+id).update({status: stages[nextIdx]});
}

function nav(p, el) {
    document.querySelectorAll('.page, .tab').forEach(x => x.classList.remove('active'));
    document.getElementById(p+'Page').classList.add('active');
    el.classList.add('active');
}
</script>
</body>
</html>
