<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHANTI JEWEL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --gold: #D4AF37; --brown: #3E2723; --cream: #FFFDE7; --text: #212121; --red: #d32f2f; }
        body { font-family: 'Montserrat', sans-serif; background: #fdfbf7; margin: 0; padding-bottom: 90px; color: var(--text); }
        
        .header { background: var(--brown); color: var(--gold); text-align: center; padding: 25px 10px; border-bottom: 5px solid var(--gold); }
        .header h1 { font-family: 'Cinzel', serif; margin: 0; font-size: 26px; letter-spacing: 5px; }
        .header span { font-size: 12px; letter-spacing: 8px; display: block; margin-bottom: 8px; opacity: 0.9; }

        #loginOverlay, #dashLockOverlay { position: fixed; inset: 0; background: var(--brown); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 25px; text-align: center; border: 3px solid var(--gold); width: 85%; max-width: 350px; }
        
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; height: 75px; border-top: 2px solid var(--gold); z-index: 1000; }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #999; text-transform: uppercase; }
        .tab.active { color: var(--brown); background: var(--cream); border-top: 6px solid var(--gold); }

        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        
        .card { background: white; border-radius: 18px; padding: 20px; margin-bottom: 20px; border: 1px solid #eee; box-shadow: 0 6px 12px rgba(0,0,0,0.06); }
        
        input, select, textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; box-sizing: border-box; }
        .btn-gold { background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728); border: none; padding: 18px; border-radius: 12px; color: #3E2723; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn-red { background: var(--red); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; margin-top: 20px; font-weight: bold; }

        .single-photo-box { height: 180px; background: #fdfdfd; border: 2px dashed var(--gold); border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px; cursor: pointer; color: var(--gold); font-weight: bold; }
        .single-photo-box img { width: 100%; height: 100%; object-fit: contain; }

        .party-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        #shareCanvas { position: fixed; left: -9999px; width: 500px; background: #FFF; padding: 30px; border: 8px solid var(--gold); }
    </style>
</head>
<body>

<div id="shareCanvas">
    <div style="text-align:center; color:var(--brown);">
        <span style="letter-spacing:10px; font-weight:bold;">॥ श्री ॥</span>
        <h1 style="font-family:'Cinzel'; font-size:36px; margin:10px 0;">SHANTI JEWEL</h1>
    </div>
    <div id="canvasBody" style="padding:20px;"></div>
</div>

<div id="loginOverlay">
    <div class="login-card">
        <span>॥ श्री ॥</span>
        <h2 style="font-family: 'Cinzel'; color: var(--brown);">SHANTI JEWEL</h2>
        <input type="password" id="passInput" placeholder="PIN" style="text-align:center;">
        <button class="btn-gold" onclick="auth()">ACCESS</button>
    </div>
</div>

<div class="header">
    <span>॥ श्री ॥</span>
    <h1>SHANTI JEWEL</h1>
</div>

<div id="punchPage" class="page active">
    <div class="card">
        <div class="single-photo-box" id="p1" onclick="document.getElementById('f1').click()">TAP TO ADD PRODUCT IMAGE</div>
        <input type="file" id="f1" accept="image/*" hidden onchange="cmp(this, 0, 'p1')">
        <input type="text" id="i_id" placeholder="ORDER ID">
        <select id="i_pa">
            <option value="">SELECT PARTY</option>
            <option>Shree Gajanan Jewellers</option>
            <option>P.N.GADGIL & SONS</option>
            <option>PNG Brothers</option>
            <option>Neelkanth Jewellers</option>
            <option>Annapurna Gold</option>
            <option>Inhouse Production</option>
        </select>
        <div style="display:flex; gap:10px;"><input type="number" step="0.001" id="i_wt" placeholder="WT"><input type="text" id="i_kt" placeholder="KT"></div>
        <div style="display:flex; gap:10px;"><input type="text" id="i_sz" placeholder="SIZE"><input type="date" id="i_dd"></div>
        <textarea id="i_sp" rows="2" placeholder="INSTRUCTIONS"></textarea>
        <button class="btn-gold" id="saveBtn" onclick="save()">PUNCH ORDER</button>
    </div>
</div>

<div id="activePage" class="page">
    <input type="text" id="src" placeholder="SEARCH ID..." onkeyup="filter()" style="margin-bottom:15px; border:2px solid var(--gold);">
    <div id="activeList"></div>
</div>

<div id="dashPage" class="page">
    <div id="dashContent" style="display:none;">
        <h3 style="font-family:'Cinzel'; color:var(--brown);">STOCK SUMMARY</h3>
        <div id="statList" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;"></div>
        
        <h3 style="font-family:'Cinzel'; color:var(--brown);">PARTY WISE</h3>
        <div class="card" id="partyList" style="padding:10px;"></div>

        <button class="btn-red" onclick="wipeout()">WIPEOUT ALL DATA</button>
    </div>
    
    <div id="innerLock" style="text-align:center; padding-top:50px;">
        <div style="font-size:50px;">🔒</div>
        <p>Dashboard is Locked</p>
        <input type="password" id="dashPin" placeholder="ENTER PIN" style="width:150px; text-align:center;">
        <button class="btn-gold" onclick="unlockDash()">UNLOCK</button>
    </div>
</div>

<div class="tab-bar">
    <div class="tab active" onclick="nav('punch', this)">Punch</div>
    <div class="tab" onclick="nav('active', this)">Active</div>
    <div class="tab" onclick="nav('dash', this)">Dash</div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBnvmQBPkJmJcjXf71vEUY91B2_2P9oAgU",
    authDomain: "shanti-jewel-order.firebaseapp.com",
    projectId: "shanti-jewel-order",
    databaseURL: "https://shanti-jewel-order-default-rtdb.firebaseio.com/",
    storageBucket: "shanti-jewel-order.appspot.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database(), storage = firebase.storage();
const stages = ["CAD", "CAM", "CASTING", "POLISH", "HUID", "READY"];
let blobs = [null];

function auth(){ if(document.getElementById('passInput').value==='1008'){ document.getElementById('loginOverlay').remove(); load(); } }
function unlockDash(){ if(document.getElementById('dashPin').value==='1008'){ document.getElementById('innerLock').style.display='none'; document.getElementById('dashContent').style.display='block'; } }

function cmp(input, idx, pId) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 800; let w=img.width, h=img.height;
            if(w>MAX){ h *= MAX/w; w=MAX; }
            canvas.width=w; canvas.height=h;
            canvas.getContext('2d').drawImage(img,0,0,w,h);
            canvas.toBlob(b => { blobs[idx]=b; document.getElementById(pId).innerHTML=`<img src="${URL.createObjectURL(b)}">`; }, 'image/jpeg', 0.7);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

async function save() {
    const id = document.getElementById('i_id').value;
    if(!id) return alert("ID Required");
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.innerText = "UPLOADING...";

    const data = {
        id: id, party: document.getElementById('i_pa').value,
        wt: parseFloat(document.getElementById('i_wt').value || 0), kt: document.getElementById('i_kt').value,
        sz: document.getElementById('i_sz').value, dd: document.getElementById('i_dd').value,
        status: "CAD", ts: Date.now()
    };

    try {
        await db.ref('orders/'+id).set(data);
        if(blobs[0]){
            const ref = storage.ref(`orders/${id}/p0.jpg`);
            const task = ref.put(blobs[0]);
            task.on('state_changed', null, null, async () => {
                const url = await ref.getDownloadURL();
                await db.ref(`orders/${id}/imgs/0`).set(url);
                alert("SUCCESS: Live Now!"); location.reload();
            });
        } else { location.reload(); }
    } catch(e) { alert(e.message); btn.disabled=false; }
}

function load() {
    db.ref('orders').on('value', snap => {
        const all = Object.values(snap.val() || {});
        const act = document.getElementById('activeList'), partBox = document.getElementById('partyList');
        const stats = {}; stages.forEach(s => stats[s] = 0);
        const partyData = {};

        act.innerHTML = "";
        all.reverse().forEach(o => {
            stats[o.status]++;
            // Party Wise Logic
            if(!partyData[o.party]) partyData[o.party] = { count: 0, wt: 0 };
            partyData[o.party].count++;
            partyData[o.party].wt += o.wt;

            const img = (o.imgs && o.imgs[0]) ? o.imgs[0] : '';
            if(o.status !== 'READY') {
                act.innerHTML += `<div class="card">
                    <div style="display:flex; gap:10px;"><img src="${img}" style="width:60px; height:60px; object-fit:cover; border-radius:10px;">
                    <div><b>${o.id}</b><br><small>${o.party}</small></div></div>
                    <button class="btn-gold" style="margin-top:10px; padding:10px; font-size:10px;" onclick='shareCAD(${JSON.stringify(o)})'>SHARE CAD FORM</button>
                </div>`;
            }
        });

        document.getElementById('statList').innerHTML = stages.map(s => `<div style="background:var(--brown); color:var(--gold); padding:15px; border-radius:12px; text-align:center;"><b>${stats[s]}</b><br><small>${s}</small></div>`).join('');
        
        partBox.innerHTML = Object.keys(partyData).map(p => `
            <div class="party-row">
                <span><b>${p || 'Unknown'}</b></span>
                <span>${partyData[p].count} Pcs | ${partyData[p].wt.toFixed(3)}g</span>
            </div>
        `).join('');
    });
}

function wipeout() {
    if(confirm("DANGER: This will delete ALL orders. Continue?")) {
        db.ref('orders').remove();
        alert("System Wiped.");
        location.reload();
    }
}

function shareCAD(o) {
    const body = document.getElementById('canvasBody');
    body.innerHTML = `<img src="${o.imgs[0]}" style="width:100%; border-radius:10px;"><br>
    <h2>ID: ${o.id}</h2><b>WT:</b> ${o.wt}g | <b>KT:</b> ${o.kt}<br><b>SIZE:</b> ${o.sz}<br><b>DESC:</b> ${o.sp || '-'}`;
    html2canvas(document.getElementById('shareCanvas'), {useCORS: true}).then(cvs => {
        cvs.toBlob(b => {
            const f = new File([b], 'CAD.png', {type:'image/png'});
            if(navigator.share) navigator.share({files:[f]});
        });
    });
}

function nav(p, el) {
    document.querySelectorAll('.page, .tab').forEach(x => x.classList.remove('active'));
    document.getElementById(p+'Page').classList.add('active');
    el.classList.add('active');
}
</script>
</body>
</html>
